{% set name = "clr_loader" %}
{% set version = "0.2.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: b4cd3a2ee5f0489885ef07ffd87eb38b2cee24ca65dcacea97b34e7b59913814

build:
  number: 0
  # We skip for PPC64 and s390x since the dotnet binaries for this architecture aren't available.
  skip: true  # [ppc64le or s390x]
  skip: true  # [py<37]

requirements:
  host:
    - python
    - pip
    - setuptools >=75
    - setuptools_scm
    - wheel
    - toml
    - setuptools-scm
  run:
    - cffi >=1.17  # [py>=38]
    - cffi >=1.17  # [py>=38]
    - python

test:
  requires:
    - pip
    - importlib_resources
  commands:
    - pip check

about:
  home: https://github.com/pythonnet/clr-loader
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Generic pure Python loader for .NET runtimes
  description: |
    Implements a generic interface for loading one of the CLR (.NET) runtime
    implementations and calling simple functions on them.
  dev_url: https://github.com/pythonnet/clr-loader
  doc_url: https://pythonnet.github.io/clr-loader/

extra:
  recipe-maintainers:
    - m-rossi
    - sumit0190
